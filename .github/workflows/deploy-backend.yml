# Deploy backend lên Cloud Run mỗi khi push main.
#
# Job bị SKIP (không fail) cho tới khi cấu hình xong trên GitHub repo:
#   Settings → Secrets and variables → Actions
#
#   Variables:
#     DEPLOY_CLOUD_RUN     = "true"          (bật deploy)
#     GCP_PROJECT_ID       = <project id>
#     GCP_REGION           = ví dụ "asia-southeast1"
#     CLOUD_RUN_SERVICE    = ví dụ "lunch-backend"
#
#   Secrets:
#     GCP_SA_KEY           = JSON key của service account có quyền
#                            Cloud Run Admin + Cloud Build Editor +
#                            Service Account User
#
# Runtime env (JWT_SECRET, SMTP_*, FIREBASE_*) cấu hình trực tiếp trên
# Cloud Run service (Console hoặc gcloud), không đặt ở đây.

name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: vars.DEPLOY_CLOUD_RUN == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy from source
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source backend \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --quiet
